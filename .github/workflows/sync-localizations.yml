name: M4 HUB Arabic localization sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/sync_localizations.py"
      - ".github/workflows/sync-localizations.yml"

permissions:
  contents: write

concurrency:
  group: m4-hub-localization-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out catalogue
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Sync and publish latest PS4 localization metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/sync_localizations.py
            git add catalog.json
            if git diff --cached --quiet; then
              echo "No new or changed PS4 localization entries."
              exit 0
            fi
            git commit -m "Sync PS4 Arabic localization catalogue"
            if git push origin HEAD:main; then
              echo "Localization catalogue published."
              exit 0
            fi
            echo "Push raced with another update; retrying from latest main ($attempt/3)."
          done
          echo "Could not publish localization catalogue after three attempts."
          exit 1
