name: M4 HUB link monitor

on:
  push:
    branches: [main]
    paths:
      - "catalog.json"
      - "scripts/check_links.py"
      - ".github/workflows/link-monitor.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: write

concurrency:
  group: m4-hub-link-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out catalogue
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check catalogue links
        run: python scripts/check_links.py

      - name: Publish report when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/link-status.json
          if git diff --cached --quiet; then
            echo "Link report has no changes."
          else
            git commit -m "Update scheduled link status report"
            git push
          fi
