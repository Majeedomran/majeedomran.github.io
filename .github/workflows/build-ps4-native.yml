name: Build M4 HUB native PS4 PKG

on:
  workflow_dispatch:
  push:
    paths:
      - "ps4-native/**"
      - ".github/workflows/build-ps4-native.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      OO_PS4_TOOLCHAIN: /tmp/OpenOrbisSDK
    steps:
      - name: Checkout M4 HUB
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 libc++-18-dev libc++abi-18-dev libc6-dev make python3 curl unzip

      - name: Install pinned OpenOrbis toolchain
        run: |
          mkdir -p "$OO_PS4_TOOLCHAIN"
          curl --fail --location --retry 3 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o "$RUNNER_TEMP/openorbis-toolchain.tar.gz"
          echo "3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  $RUNNER_TEMP/openorbis-toolchain.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/openorbis-toolchain.tar.gz" -C "$OO_PS4_TOOLCHAIN"
          # Locate the SDK root from its linker script instead of assuming
          # a fixed archive layout; upstream release packaging may nest folders.
          echo "Extracted OpenOrbis files:"
          find "$OO_PS4_TOOLCHAIN" -maxdepth 5 -type f | head -100
          LINK_SCRIPT="$(find "$OO_PS4_TOOLCHAIN" -type f -name link.x -print -quit)"
          if [ -z "$LINK_SCRIPT" ]; then
            echo "::error::OpenOrbis archive did not contain link.x"
            exit 1
          fi
          SDK_ROOT="$(dirname "$LINK_SCRIPT")"
          echo "Detected OpenOrbis SDK root: $SDK_ROOT"
          test -d "$SDK_ROOT/include"
          test -d "$SDK_ROOT/bin/linux"
          echo "OO_PS4_TOOLCHAIN=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install SDL2 PS4 library
        run: |
          curl --fail --location --retry 3 \
            https://github.com/OpenOrbis/SDL-PS4/releases/download/v1.0/SDL2.tar.gz \
            -o "$RUNNER_TEMP/SDL2-PS4.tar.gz"
          tar -xzf "$RUNNER_TEMP/SDL2-PS4.tar.gz" -C "$OO_PS4_TOOLCHAIN"

      - name: Ensure OpenOrbis SDK headers are present
        run: |
          git clone --depth 1 --branch v0.5.4 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git "$RUNNER_TEMP/OpenOrbis-source"
          mkdir -p "$OO_PS4_TOOLCHAIN/include/orbis"
          cp -a "$RUNNER_TEMP/OpenOrbis-source/include/orbis/." "$OO_PS4_TOOLCHAIN/include/orbis/"
          test -f "$OO_PS4_TOOLCHAIN/include/orbis/Http.h"
          test -f "$OO_PS4_TOOLCHAIN/include/orbis/Ssl.h"
          test -f "$OO_PS4_TOOLCHAIN/include/orbis/Net.h"

      - name: Install LibOrbisPkg command-line tool
        run: |
          mkdir -p "$OO_PS4_TOOLCHAIN/bin/linux"
          curl --fail --location --retry 3 \
            https://github.com/maxton/LibOrbisPkg/releases/download/v0.2/PkgTool.Core-linux-x64-0.2.231.zip \
            -o "$RUNNER_TEMP/PkgTool.Core.zip"
          unzip -o "$RUNNER_TEMP/PkgTool.Core.zip" -d "$OO_PS4_TOOLCHAIN/bin/linux"
          chmod +x "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core"
          test -x "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core"

      - name: Install OpenSSL 1.1 compatibility for LibOrbisPkg
        run: |
          curl --fail --location --retry 3 "https://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb" --output "$RUNNER_TEMP/libssl1.1.deb"
          sudo dpkg -i "$RUNNER_TEMP/libssl1.1.deb"
          sudo ldconfig
          ldconfig -p | grep -F 'libssl.so.1.1'

      - name: Build native PS4 package
        run: |
          export CXX=clang++-18
          export LD=ld.lld-18
          make -C ps4-native check-env
          make -C ps4-native -j2
          test -s ps4-native/IV0000-MFOB00001_00-M4HUBNATIVE00001.pkg
          ls -lh ps4-native/IV0000-MFOB00001_00-M4HUBNATIVE00001.pkg

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: M4-HUB-PS4-PKG
          path: ps4-native/IV0000-MFOB00001_00-M4HUBNATIVE00001.pkg
          if-no-files-found: error
          retention-days: 30
