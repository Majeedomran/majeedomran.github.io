name: Deploy MAJEED PS4 HOST

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MAJEED PS4 HOST
        uses: actions/checkout@v4

      - name: Prepare website and pinned PS4 exploit host
        run: |
          mkdir -p _site/jb
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          git init /tmp/WebKitty
          git -C /tmp/WebKitty remote add origin https://github.com/ArabPixel/WebKitty.git
          git -C /tmp/WebKitty fetch --depth 1 origin 554cacbd1a24883531952cbdc5deb6d95100b09f
          git -C /tmp/WebKitty checkout --detach FETCH_HEAD
          rsync -a --exclude='.git' --exclude='CNAME' /tmp/WebKitty/ _site/jb/
          cp /tmp/WebKitty/index.html _site/jb/index.html
          # Keep the exploit host on the MAJEED domain; disable WebKitty's forced redirect to its own domain.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("_site/jb/index.html")
          s = p.read_text()
          start = s.find("        // redirect to http request")
          if start != -1:
              end = s.find("\n        }", start)
              if end == -1:
                  raise SystemExit("Could not locate end of WebKitty redirect block")
              s = s[:start] + "        // MAJEED patch: stay on the hosted MAJEED PS4 HOST domain.\n" + s[end + len("\n        }"):]
              p.write_text(s)
          if "window.location.href = \"http://webkitty.arabpixel.net\"" in s:
              raise SystemExit("WebKitty external redirect is still present")
          PY
          touch _site/.nojekyll _site/jb/.nojekyll
          test -s _site/jb/index.html
          echo "Verified exploit host entry: _site/jb/index.html"
          find _site/jb -maxdepth 1 -type f -printf '%f\\n' | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
