name: Deploy MAJEED PS4 HOST

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MAJEED PS4 HOST
        uses: actions/checkout@v4

      - name: Prepare website and pinned PS4 exploit host
        run: |
          mkdir -p _site/host
          rsync -a --exclude='.git' --exclude='.github' ./ _site/
          git init /tmp/WebKitty
          git -C /tmp/WebKitty remote add origin https://github.com/ArabPixel/WebKitty.git
          git -C /tmp/WebKitty fetch --depth 1 origin 554cacbd1a24883531952cbdc5deb6d95100b09f
          git -C /tmp/WebKitty checkout --detach FETCH_HEAD
          rsync -a --exclude='.git' --exclude='CNAME' /tmp/WebKitty/ _site/host/
          touch _site/.nojekyll _site/host/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
